<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="fas fa-hotel"></i>
        <h2>HotelManager</h2>
      </div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join us and start managing hotels</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div *ngIf="error" class="error-message">
        <i class="fas fa-exclamation-circle"></i>
        <p>{{ error }}</p>
      </div>

      <div class="form-group">
        <label class="form-label">
          <i class="fas fa-user"></i>
          First Name
        </label>
        <input
          type="text"
          [(ngModel)]="firstName"
          name="firstName"
          class="form-input"
          placeholder="Enter your first name"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label">
          <i class="fas fa-user"></i>
          Last Name
        </label>
        <input
          type="text"
          [(ngModel)]="lastName"
          name="lastName"
          class="form-input"
          placeholder="Enter your last name"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label">
          <i class="fas fa-envelope"></i>
          Email
        </label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          class="form-input"
          placeholder="Enter your email"
          required
          email
        >
      </div>

      <div class="form-group">
        <label class="form-label">
          <i class="fas fa-lock"></i>
          Password
        </label>
        <div class="password-input-container">
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            class="form-input"
            placeholder="Create a password"
            required
            minlength="6"
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">
          <i class="fas fa-lock"></i>
          Confirm Password
        </label>
        <div class="password-input-container">
          <input
            type="password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            class="form-input"
            placeholder="Confirm your password"
            required
          >
        </div>
      </div>

      <button
        type="submit"
        class="auth-button"
        [disabled]="isLoading || !registerForm.valid"
        [class.loading]="isLoading"
      >
        <span *ngIf="!isLoading">
          <i class="fas fa-user-plus"></i>
          Create Account
        </span>
        <span *ngIf="isLoading" class="loading-content">
          <i class="fas fa-spinner fa-spin"></i>
          Creating Account...
        </span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/auth/login" class="register-link">Sign In</a></p>
    </div>
  </div>
</div>
