<a class="card"
   [class]="'card-' + variant"
   [class.card-loading]="isLoading"
   [class.card-disabled]="isDisabled"
   [class.card-highlighted]="isHighlighted"
   [class.card-clickable]="routerLink || href || cardClick.observed"
   [routerLink]="routerLink"
   [href]="href"
   (click)="onCardClick($event)">

  <div class="card-loading-overlay" *ngIf="isLoading">
    <div class="spinner">
      <i class="fas fa-spinner fa-spin"></i>
    </div>
  </div>

  <div class="card-image" *ngIf="showImage && imageUrl">
    <img [src]="imageUrl" [alt]="imageAlt" loading="lazy" />

    <div class="card-overlay-top">
      <div class="card-badges" *ngIf="badges.length > 0">
        <span *ngFor="let badge of badges; let i = index"
              class="badge"
              [class.badge-accent]="i === getAccentBadgeIndex()">
          {{ badge.text }}
        </span>
      </div>

      <div class="card-rating" *ngIf="rating !== null">
        <i class="fas fa-star rating-star"></i>
        <span class="rating-value">{{ rating }}</span>
      </div>
    </div>

    <div class="price-tag" *ngIf="price !== null">
      <span class="currency">{{ currency }}</span>
      <span class="amount">{{ price | number:'1.2-2' }}</span>
      <span class="period" *ngIf="variant === 'hotel' || variant === 'room'">/noche</span>
    </div>
  </div>

  <div class="card-body" *ngIf="showContent">
    <div class="card-content">
      <h3 class="card-title" *ngIf="title">{{ title }}</h3>
      <p class="card-subtitle" *ngIf="subtitle">{{ subtitle }}</p>
      <p class="card-description" *ngIf="description">{{ description }}</p>
    </div>

    <div class="card-details" [ngSwitch]="variant">
      <div *ngSwitchCase="'hotel'" class="hotel-details">
        <ng-content select="[slot=hotel-amenities]"></ng-content>
        <ng-content select="[slot=hotel-location]"></ng-content>
      </div>
      <div *ngSwitchCase="'room'" class="room-details">
        <ng-content select="[slot=room-features]"></ng-content>
        <ng-content select="[slot=room-capacity]"></ng-content>
      </div>
      <div *ngSwitchCase="'reservation'" class="reservation-details">
        <ng-content select="[slot=reservation-dates]"></ng-content>
        <ng-content select="[slot=reservation-status]"></ng-content>
      </div>
      <div *ngSwitchCase="'promotion'" class="promotion-details">
        <ng-content select="[slot=promotion-validity]"></ng-content>
        <ng-content select="[slot=promotion-discount]"></ng-content>
      </div>
      <div *ngSwitchCase="'user'" class="user-details">
        <ng-content select="[slot=user-role]"></ng-content>
        <ng-content select="[slot=user-status]"></ng-content>
      </div>
      <div *ngSwitchDefault>
        <ng-content></ng-content>
      </div>
    </div>
  </div>

  <div class="card-actions" *ngIf="showActions && actions.length > 0">
    <button *ngFor="let action of actions"
            [class]="getActionClass(action.variant)"
            [disabled]="action.disabled || isDisabled"
            (click)="onActionClick($event, action.action)">
      <i [class]="action.icon" *ngIf="action.icon"></i>
      {{ action.label }}
    </button>
  </div>

  <div class="card-footer" *ngIf="showFooter">
    <ng-content select="[slot=footer]"></ng-content>
  </div>
</a>
